services:
  - type: web
    name: os-portal-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install && npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run build --workspace=@os-portal/api
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: WEB_APP_URL
        value: https://portal.oderindestephen.com
      - key: CALCOM_DEFAULT_USERNAME
        value: oderinde
      - key: CALCOM_DEFAULT_EVENT
        value: free
      - key: CALCOM_DEFAULT_TIMEZONE
        value: Asia/Dubai
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CAL_API_KEY
        sync: false
      - key: CALCOM_WEBHOOK_SECRET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:stephenoderinde@gmail.com
